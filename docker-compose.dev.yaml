version: "3.9"

services:
  db:
    image: postgres:17
    container_name: gymmanager-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./server/init/db:/docker-entrypoint-initdb.d
      - gymmanager-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./server
      dockerfile: dockerfile.dev
    container_name: gymmanager-backend-dev
    volumes:
      - ./server:/app
      - /app/node_modules
    ports:
      - "${BACKEND_PORT}:3000"
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./client
      dockerfile: dockerfile.dev
    container_name: gymmanager-frontend-dev
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      - backend
volumes:
  gymmanager-data: