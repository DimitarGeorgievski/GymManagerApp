version: "3.9"
services:
  db:
    image: postgres:17
    container_name: gymmanager-db-dev
    restart: always
    env_file:
      - .env
    volumes:
      - ./server/init/db:/docker-entrypoint-initdb.d
      - gymmanager-data-dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./server
      dockerfile: dockerfile.dev
    container_name: gymmanager-backend-dev
    restart: always
    env_file:
      - ./server/.env
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./client
      dockerfile: dockerfile.dev
    container_name: gymmanager-frontend-dev
    restart: always
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  gymmanager-data-dev: