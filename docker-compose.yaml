services:
  db:
    image: postgres:17
    container_name: gymmanager-db-normal
    restart: always
    env_file:
      - .env
    volumes:
      - ./server/init/db:/docker-entrypoint-initdb.d
      - gymmanager-data-normal:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./server
      dockerfile: dockerfile
    container_name: gymmanager-backend-normal
    restart: always
    env_file:
      - ./server/.env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./client
      dockerfile: dockerfile
      args:
        VITE_API_URL: /api
    container_name: gymmanager-frontend-normal
    restart: always
    environment:
      - VITE_API_URL=/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  gymmanager-data-normal: