version: "3.9"
services:
  db:
    image: postgres:17
    container_name: gymmanager-db-normal
    restart: always
    env_file:
      - .env
    volumes:
      - ./server/init/db:/docker-entrypoint-initdb.d
      - gymmanager-data-normal:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  seed:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./server/init/db:/docker-entrypoint-initdb.d:ro
    command: >
      sh -c "apk add --no-cache postgresql-client 2>/dev/null &&
             psql -U postgres -d gymmanager -h db -f /docker-entrypoint-initdb.d/init.sql"
    restart: "no"
  backend:
    build:
      context: ./server
      dockerfile: dockerfile
    container_name: gymmanager-backend-normal
    restart: always
    env_file:
      - ./server/.env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
  frontend:
    build:
      context: ./client
      dockerfile: dockerfile
    container_name: gymmanager-frontend-normal
    restart: always
    environment:
      - VITE_API_URL=http://localhost:3000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  gymmanager-data-normal: